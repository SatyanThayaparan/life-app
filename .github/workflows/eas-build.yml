name: Expo cloud build
on:
  workflow_dispatch:
    inputs:
      platform:
        description: Build platform
        required: true
        type: choice
        options:
          - ios
          - android
      profile:
        description: EAS build profile
        required: true
        type: choice
        options:
          - preview
          - production
jobs:
  build:
    name: Request EAS build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: npm install
      - name: Verify Expo account configuration
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EXPO_PROJECT_ID: ${{ vars.EXPO_PROJECT_ID }}
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::error::Add an Expo access token as repository secret EXPO_TOKEN."
            exit 1
          fi
          if [ -z "$EXPO_PROJECT_ID" ]; then
            echo "::error::Set repository variable EXPO_PROJECT_ID to your EAS project UUID."
            exit 1
          fi
      - name: Set up Expo and EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - name: Request cloud build
        env:
          EXPO_PROJECT_ID: ${{ vars.EXPO_PROJECT_ID }}
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          npx eas-cli build --platform "${{ inputs.platform }}" --profile "${{ inputs.profile }}" --non-interactive --no-wait
